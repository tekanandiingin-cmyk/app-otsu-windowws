name: Build EXE (Windows)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ekstrak proyek dari file zip
        shell: pwsh
        run: Expand-Archive -Path OtsuShop-Pembeli-Windows.zip -DestinationPath . -Force

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        working-directory: desktop-pembeli
        run: npm ci

      - name: Build EXE
        working-directory: desktop-pembeli
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: OtsuShop-Pembeli-EXE
          path: desktop-pembeli/dist/OtsuShop-Pembeli.exe
